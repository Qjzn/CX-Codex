name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify:release -- -SchemaAudit skip

  windows-bootstrap-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run local bootstrap smoke test
        shell: pwsh
        run: |
          $jsonLines = @(
            ./scripts/bootstrap-windows.ps1 `
              -SourceRepoRoot $PWD `
              -InstallDir "$env:TEMP\cx-codex-smoke-install" `
              -WorkspacePath "$env:TEMP\CodexWorkspace" `
              -Port 7441 `
              -Password "ci-password" `
              -SkipStartupTask `
              -SkipFirewall `
              -SkipLogin `
              -NoStart `
              -JsonOutput
          )
          if ($jsonLines.Count -ne 1) {
            throw "Bootstrap JSON stdout must contain exactly one line; found $($jsonLines.Count)."
          }
          $result = $jsonLines[0] | ConvertFrom-Json
          if (-not $result.ok -or $result.schemaVersion -ne 1 -or $result.operation -ne "install") {
            throw "Bootstrap JSON result is invalid."
          }
          if ($result.started -or $result.healthReady) {
            throw "No-start bootstrap smoke must not claim the service is running."
          }

      - name: Validate generated files
        shell: pwsh
        run: |
          $launcher = "$env:USERPROFILE\.local\bin\cx-codex-start.cmd"
          Test-Path $launcher | Where-Object { $_ } | Out-Null
          Test-Path "$env:USERPROFILE\.cx-codex\config.json" | Where-Object { $_ } | Out-Null
          $launcherContent = Get-Content -LiteralPath $launcher -Raw
          if ($launcherContent -match '(?m)^\s*""\s') {
            throw "Generated launcher contains an empty Node.js command."
          }
          $expectedNode = (Get-Command node -ErrorAction Stop).Source
          if (-not $launcherContent.Contains($expectedNode)) {
            throw "Generated launcher does not contain the selected Node.js path."
          }

      - name: Run Windows productization smoke test
        shell: pwsh
        run: npm run verify:windows-productization

      - name: Run locked in-place upgrade smoke test
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $installDir = "$env:TEMP\cx-codex-smoke-install"
          $distCliDir = Join-Path $installDir "dist-cli"
          New-Item -ItemType Directory -Path $distCliDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $installDir "upgrade-lock.txt") -Value "previous installation"
          $serverEntryPoint = Join-Path $distCliDir "index.js"
          Set-Content -LiteralPath $serverEntryPoint -Value "const{spawn}=require('node:child_process');spawn(process.execPath,['-e','setInterval(()=>{},60000)'],{stdio:'ignore'});require('node:net').createServer(()=>{}).listen(7441,'127.0.0.1')"
          $nodePath = (Get-Command node -ErrorAction Stop).Source
          $lockProcess = Start-Process `
            -FilePath $nodePath `
            -ArgumentList @("`"$serverEntryPoint`"") `
            -WorkingDirectory $installDir `
            -WindowStyle Hidden `
            -PassThru
          try {
            $pidMarker = "$env:USERPROFILE\.cx-codex\cx-codex-7441.pid"
            Set-Content -LiteralPath $pidMarker -Value ([string]$lockProcess.Id)
            $listenDeadline = (Get-Date).AddSeconds(10)
            do {
              $listener = Get-NetTCPConnection -LocalPort 7441 -State Listen -ErrorAction SilentlyContinue
              if ($listener) {
                break
              }
              Start-Sleep -Milliseconds 100
            } while ((Get-Date) -lt $listenDeadline)
            if (-not $listener -or [int]$listener.OwningProcess -ne $lockProcess.Id) {
              throw "Upgrade fixture did not acquire the expected listener and PID marker."
            }
            # This lock fixture is intentionally not a CX-Codex health server.
            if ($env:SOURCE_REPOSITORY -notmatch '^[^/]+/[^/]+$') {
              throw "Source repository must use the owner/name format."
            }
            if ([string]::IsNullOrWhiteSpace($env:SOURCE_BRANCH)) {
              throw "Source branch must not be empty."
            }
            $repoOwner, $repoName = $env:SOURCE_REPOSITORY -split '/', 2
            $jsonLines = @(
              ./scripts/bootstrap-windows.ps1 `
                -InstallDir $installDir `
                -WorkspacePath "$env:TEMP\CodexWorkspace" `
                -Port 7441 `
                -Password "ci-password" `
                -RepoOwner $repoOwner `
                -RepoName $repoName `
                -Branch $env:SOURCE_BRANCH `
                -UseBranchArchive `
                -ForceActiveTaskUpgrade `
                -SkipStartupTask `
                -SkipWatchdogTask `
                -SkipFirewall `
                -SkipLogin `
                -NoStart `
                -JsonOutput
            )
            if ($jsonLines.Count -ne 1) {
              throw "Upgrade bootstrap JSON stdout must contain exactly one line; found $($jsonLines.Count)."
            }
            $result = $jsonLines[0] | ConvertFrom-Json
            if (-not $result.ok -or $result.schemaVersion -ne 1 -or $result.operation -ne "install") {
              throw "Upgrade bootstrap JSON result is invalid."
            }
            $lockProcess.Refresh()
            if (-not $lockProcess.HasExited) {
              throw "Upgrade bootstrap did not stop the process locking the previous installation."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installDir "package.json"))) {
              throw "Upgrade bootstrap did not replace the installation."
            }
            if (-not (Test-Path -LiteralPath "$installDir.previous\upgrade-lock.txt")) {
              throw "Upgrade bootstrap did not retain the previous installation for rollback."
            }
          } finally {
            if (-not $lockProcess.HasExited) {
              Stop-Process -Id $lockProcess.Id -Force -ErrorAction SilentlyContinue
            }
            $lockProcess.Dispose()
          }

      - name: Run official uninstall cleanup
        if: always()
        shell: pwsh
        run: |
          $jsonLines = @(
            ./scripts/uninstall-windows.ps1 `
              -InstallDir "$env:TEMP\cx-codex-smoke-install" `
              -StateDir "$env:USERPROFILE\.cx-codex" `
              -LauncherPath "$env:USERPROFILE\.local\bin\cx-codex-start.cmd" `
              -ManagedBinDir "$env:USERPROFILE\.local\bin" `
              -Port 7441 `
              -RemoveUserData `
              -JsonOutput
          )
          if ($jsonLines.Count -ne 1) {
            throw "Uninstall JSON stdout must contain exactly one line; found $($jsonLines.Count)."
          }
          $result = $jsonLines[0] | ConvertFrom-Json
          if (-not $result.ok -or $result.schemaVersion -ne 1 -or $result.operation -ne "uninstall") {
            throw "Uninstall JSON result is invalid."
          }
